server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: buyflow-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/kalpee_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USER:kalpee_user}
    password: ${DB_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate   # le schema est gere par Flyway, jamais par Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-production-min-256-bits-long-please}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}      # 15 min
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 jours
    cookie-name: buyflow_at
    refresh-cookie-name: buyflow_rt
    cookie-secure: ${COOKIE_SECURE:true}
    cookie-domain: ${COOKIE_DOMAIN:}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
    apple:
      client-id: ${APPLE_CLIENT_ID:}      # Services ID (com.buyflow.web par ex.)
      bundle-ids: ${APPLE_BUNDLE_IDS:}    # optionnel, App IDs autorises, separes par des virgules
  uploads:
    dir: ${UPLOADS_DIR:./uploads}
    max-size-bytes: 5242880
    allowed-content-types: image/png,image/jpeg,image/webp

logging:
  level:
    root: INFO
    com.buyflow: DEBUG
    org.springframework.security: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      show-components: always
